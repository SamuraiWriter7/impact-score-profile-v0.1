spec:
  name: Impact Score Profile
  short_name: ISP
  file_name: impact-score-profile-v0.1.yaml
  version: v0.1
  status: draft
  authors:
    - Shidenkai Alpha
  language: en
  license: MIT
  created_at: 2026-05-02
  updated_at: 2026-05-02

  summary:
    one_line: >
      A minimal scoring profile for evaluating how strongly a communication-derived
      trace event contributed to later meaning generation.

  purpose: >
    This profile standardizes a minimal, decomposable impact assessment model for
    communication-derived trace events. It is intended to support downstream systems
    such as gratitude, trust, attribution, audit, and royalty-candidate review
    without collapsing all value assessment into a single opaque number.

  relationship_to_ctr: >
    Impact Score Profile v0.1 is an adjunct profile for communication trace systems
    such as CTR. It does not replace event records or identifier models. Instead,
    it defines how a recorded event may be evaluated in terms of contribution to
    later meaning generation.

  relationship_to_ctr_id: >
    This profile assumes that event identity and lineage are already handled by a
    compatible identifier layer such as CTR-ID. Impact scoring should be applied to
    stable trace events, not ambiguous or overloaded identifiers.

  design_principles:
    - Keep the profile minimal and interoperable.
    - Prefer decomposable scoring over opaque single-number judgments.
    - Separate impact assessment from ownership determination.
    - Separate impact assessment from monetary settlement.
    - Support human, AI, hybrid, and rule-based assessment methods.
    - Preserve auditability by exposing dimensions and weights.
    - Allow multiple scopes of assessment.
    - Treat scores as evaluative signals, not final truth.

  non_goals:
    - Legal ownership determination
    - Automatic monetary royalty calculation
    - Full provenance graph modeling
    - Mandatory use of any single scoring formula
    - Identity verification infrastructure
    - Cryptographic attestation infrastructure

core_concepts:
  impact_score: >
    A normalized total score representing how strongly a trace event contributed
    to later meaning generation within a declared assessment scope.
  scoring_dimension: >
    A decomposed evaluative axis used to explain why an event received a given score.
  assessment_method: >
    The method used to produce the score, such as human, AI, hybrid, or rule-based.
  assessment_scope: >
    The context within which the score is meant to be interpreted.
  confidence: >
    The evaluator’s confidence in the assessment itself, not the impact score alone.

scoring_model:
  score_range:
    minimum: 0.0
    maximum: 1.0
    normalized: true

  total_score_field: impact_score

  default_dimensions:
    - name: reference_strength
      description: >
        How strongly the event was actually referenced, used, or relied upon by
        later meaning generation.
      minimum: 0.0
      maximum: 1.0

    - name: transformation_weight
      description: >
        How strongly the event shaped transformation, reframing, summarization,
        translation, or restructuring in downstream outputs.
      minimum: 0.0
      maximum: 1.0

    - name: novelty_delta
      description: >
        How much new structure, framing, or meaningful differentiation emerged
        through this event rather than mere repetition.
      minimum: 0.0
      maximum: 1.0

    - name: dependency_weight
      description: >
        How difficult it would have been for the downstream meaning-generation event
        to occur in a similar way without this event.
      minimum: 0.0
      maximum: 1.0

    - name: downstream_reuse_potential
      description: >
        How likely this event is to be reused, propagated, or referenced across
        additional downstream contexts.
      minimum: 0.0
      maximum: 1.0

  optional_dimensions:
    - name: semantic_centrality
      description: >
        Whether the event was central to the core meaning rather than peripheral.
      minimum: 0.0
      maximum: 1.0

    - name: influence_scope
      description: >
        Breadth of downstream effect across session, thread, conversation,
        or cross-system circulation.
      minimum: 0.0
      maximum: 1.0

    - name: originality_support
      description: >
        Degree to which the event supported an original pattern, framing,
        or structural breakthrough.
      minimum: 0.0
      maximum: 1.0

  recommended_weight_profile:
    reference_strength: 0.25
    transformation_weight: 0.20
    novelty_delta: 0.20
    dependency_weight: 0.20
    downstream_reuse_potential: 0.15

  weighting_rules:
    - All weights should sum to 1.0 when a weighted total is used.
    - Implementations may change weights, but should disclose them.
    - Omitted optional dimensions should not silently distort score interpretation.
    - A total score without dimension disclosure is discouraged.

assessment_profile:
  required_fields:
    - assessment_id
    - trace_event_id
    - impact_score
    - dimensions
    - assessment_method
    - assessment_scope
    - confidence
    - assessed_at

  recommended_fields:
    - event_record_id
    - communication_id
    - conversation_root_id
    - artifact_id
    - structure_refs
    - evaluator
    - rationale
    - score_formula
    - weight_profile
    - evidence_refs

  field_definitions:
    assessment_id:
      type: string
      pattern: "^isp_[A-Za-z0-9._:-]{8,128}$"
      description: Unique identifier of this impact assessment record.

    event_record_id:
      type: string
      pattern: "^ctr_[A-Za-z0-9._:-]{8,128}$"
      description: Optional related serialized record identifier.

    trace_event_id:
      type: string
      pattern: "^ctid_[A-Za-z0-9._:-]{8,128}$"
      description: Stable identifier of the evaluated trace event.

    communication_id:
      type: string
      pattern: "^comm_[A-Za-z0-9._:-]{8,128}$"
      description: Optional communication object identifier.

    conversation_root_id:
      type: string
      pattern: "^conv_[A-Za-z0-9._:-]{8,128}$"
      description: Optional conversation lineage root identifier.

    artifact_id:
      type: string
      pattern: "^art_[A-Za-z0-9._:-]{8,128}$"
      description: Optional related downstream artifact identifier.

    structure_refs:
      type: array
      description: Optional semantic structure references relevant to assessment.
      items:
        structure_id:
          type: string
          pattern: "^sid_[A-Za-z0-9._:-]{8,128}$"
        relation:
          type: string
          enum:
            - originates
            - references
            - refines
            - transforms
            - summarizes
            - translates
            - critiques
            - merges
            - branches_from
            - instantiates

    impact_score:
      type: number
      minimum: 0.0
      maximum: 1.0
      description: Normalized total impact score.

    dimensions:
      type: object
      required:
        - reference_strength
        - transformation_weight
        - novelty_delta
        - dependency_weight
        - downstream_reuse_potential
      properties:
        reference_strength:
          type: number
          minimum: 0.0
          maximum: 1.0
        transformation_weight:
          type: number
          minimum: 0.0
          maximum: 1.0
        novelty_delta:
          type: number
          minimum: 0.0
          maximum: 1.0
        dependency_weight:
          type: number
          minimum: 0.0
          maximum: 1.0
        downstream_reuse_potential:
          type: number
          minimum: 0.0
          maximum: 1.0
        semantic_centrality:
          type: number
          minimum: 0.0
          maximum: 1.0
        influence_scope:
          type: number
          minimum: 0.0
          maximum: 1.0
        originality_support:
          type: number
          minimum: 0.0
          maximum: 1.0

    weight_profile:
      type: object
      description: >
        Optional disclosed weights used to compute the total impact score.
      properties:
        reference_strength:
          type: number
          minimum: 0.0
          maximum: 1.0
        transformation_weight:
          type: number
          minimum: 0.0
          maximum: 1.0
        novelty_delta:
          type: number
          minimum: 0.0
          maximum: 1.0
        dependency_weight:
          type: number
          minimum: 0.0
          maximum: 1.0
        downstream_reuse_potential:
          type: number
          minimum: 0.0
          maximum: 1.0
        semantic_centrality:
          type: number
          minimum: 0.0
          maximum: 1.0
        influence_scope:
          type: number
          minimum: 0.0
          maximum: 1.0
        originality_support:
          type: number
          minimum: 0.0
          maximum: 1.0

    score_formula:
      type: string
      description: >
        Optional human-readable formula or method note used to compute impact_score.

    assessment_method:
      type: string
      enum:
        - human
        - ai
        - hybrid
        - rule_based
      description: Method used to produce the assessment.

    assessment_scope:
      type: string
      enum:
        - local
        - session
        - thread
        - conversation
        - cross_system
      description: Scope within which the score is intended to be interpreted.

    confidence:
      type: number
      minimum: 0.0
      maximum: 1.0
      description: Confidence in the assessment itself.

    evaluator:
      type: object
      description: Optional evaluator metadata.
      properties:
        evaluator_type:
          type: string
          enum:
            - human
            - ai
            - hybrid_system
            - rule_engine
        evaluator_id:
          type: string
        model_name:
          type: string
        organization:
          type: string

    rationale:
      type: string
      description: Human-readable explanation of why this score was assigned.

    evidence_refs:
      type: array
      description: Optional references to logs, artifacts, or audit evidence.
      items:
        type: string

    assessed_at:
      type: string
      format: date-time
      description: Timestamp when the assessment was produced.

scoring_guidance:
  interpretation_bands:
    - range: "0.00-0.19"
      label: negligible
      meaning: >
        The event had little or no meaningful downstream contribution in the
        declared assessment scope.

    - range: "0.20-0.39"
      label: low
      meaning: >
        The event contributed in a minor or peripheral way.

    - range: "0.40-0.59"
      label: moderate
      meaning: >
        The event made a meaningful but not dominant contribution.

    - range: "0.60-0.79"
      label: high
      meaning: >
        The event materially shaped downstream meaning generation.

    - range: "0.80-1.00"
      label: critical
      meaning: >
        The event was central or near-indispensable within the declared scope.

  cautions:
    - A high impact score does not imply ownership.
    - A high impact score does not imply legal entitlement.
    - A high impact score does not imply mandatory payment.
    - Scores from different scopes should not be compared naively.
    - Scores from different methods should disclose method differences.
    - Confidence should not be confused with impact magnitude.

recommended_computation:
  default_formula: >
    impact_score =
      (reference_strength * 0.25) +
      (transformation_weight * 0.20) +
      (novelty_delta * 0.20) +
      (dependency_weight * 0.20) +
      (downstream_reuse_potential * 0.15)

  notes:
    - This formula is recommended, not mandatory.
    - Implementations may substitute another disclosed formula.
    - If optional dimensions are used, their added weights should be explicit.
    - Hidden weighting logic is discouraged.

interoperability:
  compatible_with:
    - Communication Trace Record systems
    - CTR-ID Unified Protocol
    - Gratitude Event systems
    - Trust Event systems
    - Audit pipelines
    - Attribution pipelines
    - Royalty candidate review systems

  downstream_usage_examples:
    - Rank candidate traces for gratitude review.
    - Flag high-impact traces for trust evaluation.
    - Prioritize audit review for critical contribution events.
    - Identify royalty-candidate events without forcing automatic settlement.
    - Compare local versus conversation-level impact patterns.

